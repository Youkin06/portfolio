<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-白・色の札案 | 矢追陽平 Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="shared/base.css">
    <!--
        スキン（見た目違い）の作り方
        ・</head> の直前に、スキンの CSS と設定の JS（window.SKIN を決める）を足す。HTML の書き換えはしない。
        ・window.SKIN で変えられるもの（書かなかった項目は既定のまま）
            layout   : 'sections'（既定。サイドバーに中の項目も出す）
                       'tabs'    （選んだ大項目の中の項目だけ出す）
                       'flat'    （サイドバーに中の項目を出さない）
            text     : 画面の言葉。下の TEXT の項目名で上書きする
            iconColor: SNS アイコンの色（16進数6桁、# なし）
            mail     : 'button'（既定。メールを開くボタン）か 'text'（選んでコピーできる文字）
        ・CSS から使える目印
            body[data-layout][data-section="about|works|research"][data-page="works/zelly-swipe" など]
            .menu-group[data-section][data-active]、.menu-label（大項目へのリンク）、.menu-list a.active
            色分け用の [data-index]（0 始まり）と [data-tone]（0〜3）。既定の色は下の CSS で決めている
            スキル li[data-level="1〜5"]（.skill-name / .gauge / .skill-word）
            経歴 .exp（.exp-period / .exp-role / .exp-org / .exp-more / .exp-links）
            リンク .link--work（作品へ）/ .link--external（外のサイト。印は .ext-mark）
            About の中の項目と研究は、1つずつのページ（#about/awards、#research/2 など）
        ・build.sh は行頭の </head> を目印に差し込むので、閉じタグ </head> は必ず1行に単独で書く
    -->
    <style>
        /*
         * 既定の見た目：ゲームのメニュー画面。
         * サイドバーはRPGのコマンドウィンドウ、中身はタイトルバー付きのウィンドウで統一する。
         * 色は今のサイトの4色（赤・オレンジ・水色・黄緑）。
         */
        :root {
            --bg: #e9edf5;
            --fg: #1c2238;
            --muted: #5d6680;
            --surface: #ffffff;
            --surface-2: #f2f4f9;
            --line: #d9deea;
            --navy: #1c2238;
            --navy-2: #2a3258;
            --cursor: #ffd84d;
            --red: #ff5a5a;
            --orange: #ffa51f;
            --sky: #4fb6e8;
            --green: #8fd11c;
            --accent: #2b78c5;
            --tag-bg: #f2f4f9;
            --tag-fg: #1c2238;
            --highlight-bg: #ffd84d;
            --highlight-fg: #1c2238;
            --sidebar-w: 312px;
            --radius: 12px;
        }

        /* 色分け：data-tone（0〜3）を今のサイトの4色に。スキンはここを上書きする */
        [data-tone="0"] { --k: var(--red); }
        [data-tone="1"] { --k: var(--orange); }
        [data-tone="2"] { --k: var(--sky); }
        [data-tone="3"] { --k: var(--green); }
        [data-section="about"] { --k: var(--green); }
        [data-section="works"] { --k: var(--orange); }
        [data-section="research"] { --k: var(--sky); }

        /* 方眼紙のようなドットの背景 */
        body {
            background-color: var(--bg);
            background-image: radial-gradient(rgba(28, 34, 56, .12) 1px, transparent 1.2px);
            background-size: 18px 18px;
        }

        /* ラベル（WORKS・No.01 など）は同じフォントで、字間を広げて小さく */
        .label { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

        /* ---- サイドバー：コマンドウィンドウ ---- */
        .sidebar {
            position: fixed;
            inset: 16px auto 16px 16px;
            width: var(--sidebar-w);
            display: flex;
            flex-direction: column;
            background: var(--navy);
            color: #fff;
            border: 3px solid #fff;
            outline: 3px solid var(--navy);
            border-radius: var(--radius);
            overflow: hidden auto;
            overscroll-behavior: contain;
            scrollbar-width: none;
        }
        .sidebar::-webkit-scrollbar { display: none; }
        /* サイドバーの一番上の見出し「Youkin」（642×200 の比率で横幅いっぱい）。
           背景の模様が斜めに流れ、文字は1文字ずつ「黒い影とふち」「白い縁」「色」の3枚を重ねて、Y→o→u→k→i→n の順に跳ねる。
           いちばん上に、文字の6色が左上から右下へ斜めに移る枠（色の間はドットを混ぜてつなぐ。動かない）を重ねる。 */
        .sidebar-banner { position: relative; display: block; flex-shrink: 0; aspect-ratio: 642 / 200; overflow: hidden; background: var(--sidebar-bg, #fff); }  /* 地はサイドバーと同じ色（模様の地は透明） */
        .sidebar-banner > * { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
        /* 背景：つなぎ目のない模様（644×200）を縦横2枚分並べ、1枚分ずらし続ける */
        .banner-bg::before {
            content: ""; position: absolute; top: 0; left: 0;
            width: calc(200% * 644 / 642); height: 200%;
            background: url("../Images/sidebar-banner/bg.png") repeat 0 0 / 50% 50%;
            image-rendering: pixelated;
            animation: banner-scroll 28s linear infinite;
        }
        @keyframes banner-scroll { to { transform: translate(-50%, -50%); } }
        .sidebar-banner .hop { animation: banner-hop 1.8s steps(1) infinite; animation-delay: var(--d); }
        @keyframes banner-hop { 0%, 20% { transform: translateY(-2%); } 21%, 100% { transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .banner-bg::before, .sidebar-banner .hop { animation: none; }
        }
        .player {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            border-bottom: 2px dashed rgba(255, 255, 255, .22);
            color: #fff;
            text-decoration: none;
        }
        .player img { width: 52px; height: 52px; border-radius: 8px; image-rendering: pixelated; background: #fff; border: 2px solid #fff; }
        .player strong { display: block; font-size: 16px; }
        .player .label { color: #aeb7d6; font-size: 11px; }

        .menu { flex: 1 0 auto; padding: 8px 10px 16px; }
        .menu-group { margin-top: 12px; }
        .menu-label { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; padding: 2px 10px; color: var(--k); text-decoration: none; }
        .menu-label::after { content: ""; flex: 1; height: 2px; background: currentColor; opacity: .35; }
        .menu-list { list-style: none; margin: 0; padding: 0; }
        .menu-list a {
            position: relative;
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 7px 10px 7px 28px;
            border-radius: 6px;
            color: #dfe4f3;
            text-decoration: none;
            font-size: 14px;
            line-height: 1.45;
        }
        .menu-list .no, .menu-list .year { font-size: 12px; color: #8790b3; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .menu-list .no { width: 1.6em; }
        .menu-list .year { margin-left: auto; }
        .menu-list a::before { content: "▶"; position: absolute; left: 10px; top: 9px; font-size: 10px; color: var(--cursor); opacity: 0; }
        .menu-list a:hover { background: var(--navy-2); color: #fff; }
        .menu-list a:hover::before { opacity: .5; }
        .menu-list a.active { background: var(--navy-2); color: #fff; font-weight: 700; }
        .menu-list a.active::before { opacity: 1; }

        /* layout: 'tabs' は選んだ大項目の中だけ、'flat' は中の項目を出さない */
        [data-layout="tabs"] .menu-group:not([data-active]) .menu-list { display: none; }
        [data-layout="flat"] .menu-list { display: none; }
        [data-layout="flat"] .menu-label { padding: 8px 10px; }

        /* ---- 右側 ---- */
        main { position: relative; margin-left: calc(var(--sidebar-w) + 32px); padding: 28px 40px 96px; }
        main > .page { position: relative; }
        .page--narrow { max-width: 920px; }
        @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .page-head { margin: 4px 0 22px; }
        .page-head .label { color: var(--k, var(--accent)); }
        .page-head h1 { margin: 4px 0 0; font-size: clamp(26px, 3.2vw, 36px); font-weight: 900; line-height: 1.3; }
        .page-head p { margin: 6px 0 0; color: var(--muted); }
        .back { display: inline-block; margin-bottom: 8px; font-size: 14px; font-weight: 700; color: var(--accent); text-decoration: none; }
        .back:hover { text-decoration: underline; }

        /* すべての中身はこのウィンドウ（.block）に入れる */
        .window { background: var(--surface); border: 3px solid var(--navy); border-radius: var(--radius); box-shadow: 0 5px 0 rgba(28, 34, 56, .16); scroll-margin-top: 20px; }
        .window-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            padding: 8px 16px;
            background: var(--navy);
            color: #fff;
            border-radius: calc(var(--radius) - 4px) calc(var(--radius) - 4px) 0 0;
        }
        .window-title::before { content: ""; width: 10px; height: 10px; background: var(--k, var(--cursor)); flex-shrink: 0; }
        .window-title .count { margin-left: auto; color: #aeb7d6; letter-spacing: .04em; }
        .window-body { padding: 18px 22px; }
        .stack { display: grid; gap: 20px; align-content: start; }

        /* About：プロフィール */
        .profile { display: grid; grid-template-columns: 190px 1fr; gap: 22px; align-items: start; }
        .portrait { position: relative; aspect-ratio: 1; border: 3px solid var(--navy); border-radius: var(--radius); overflow: hidden; background: #fff; }
        .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .2s ease; }
        .portrait .pixel { opacity: 0; image-rendering: pixelated; }
        .portrait:hover .pixel { opacity: 1; }
        .profile-name { margin: 0 0 8px; font-size: 22px; }
        .profile-text { margin: 0; }
        /* SNS とメールは段を分ける */
        .contacts { display: grid; gap: 8px; margin-top: 14px; }
        .contacts-social, .contacts-mail { display: flex; flex-wrap: wrap; gap: 8px; }
        .contacts a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border: 2px solid var(--navy);
            border-radius: 8px;
            color: var(--fg);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }
        .contacts a:hover { background: var(--navy); color: #fff; }
        .contacts img { width: 16px; height: 16px; }
        .contacts .mail { display: inline-flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 13px; }
        .contacts .mail > span { user-select: all; overflow-wrap: anywhere; min-width: 0; }
        .contacts .mail-icon { flex-shrink: 0; }

        /* 技術スタック */
        /* アイコンだけを並べる（名前はマウスを乗せたときと読み上げで出る） */
        .tech-stack-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 18px; }
        .tech img { width: 44px; height: 44px; display: block; }
        /* Skills：既定はブロックのゲージ。言葉（.skill-word）はスキンで出す */
        .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 24px; }
        .skill-group h3 { margin: 0 0 8px; color: var(--muted); }
        .skill-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
        .skill-group li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
        .skill-word { display: none; }
        .gauge { display: flex; gap: 3px; }
        .gauge i { width: 12px; height: 12px; background: var(--line); }
        .gauge i.on { background: var(--k, var(--sky)); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }

        /* 経歴（インターン・バイト） */
        .exp-list, .item-list { list-style: none; margin: 0; padding: 0; }
        .exp, .item { padding: 14px 0; border-bottom: 2px dotted var(--line); }
        .exp:first-child, .item:first-child { padding-top: 0; }
        .exp:last-child, .item:last-child { border-bottom: 0; padding-bottom: 0; }
        .exp-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
        .exp-role { margin: 0; font-size: 15px; }
        .exp-org { color: var(--muted); font-size: 13px; }
        .exp-period { margin-left: auto; color: var(--muted); font-size: 13px; }
        .exp-more summary { cursor: pointer; font-size: 13px; color: var(--accent); margin-top: 4px; font-weight: 700; -webkit-user-select: none; user-select: none; }
        .exp-content { display: flow-root; }
        .exp-more p { margin: 6px 0 0; font-size: 14px; line-height: 1.85; }
        .exp-more figure { margin: 10px 0 0; max-width: 340px; }
        .exp-more figure img { border-radius: 8px; border: 2px solid var(--navy); }
        .exp-more figcaption { font-size: 12px; color: var(--muted); }
        .exp-links, .item-links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 13px; }
        .item-text { font-weight: 700; font-size: 15px; }
        .awards .item-text::before { content: "★ "; color: var(--orange); }

        /* 作品一覧：上の2本は大きく、残りは3列 */
        .featured { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .card { position: relative; overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; }
        .card:hover, .card:focus-within { transform: translateY(-4px); box-shadow: 0 9px 0 rgba(28, 34, 56, .16); }
        .card .thumb { position: relative; aspect-ratio: 16 / 9; background: #000; border-bottom: 3px solid var(--navy); }
        .card .thumb img, .card .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card .no { position: absolute; top: 8px; left: 8px; padding: 2px 8px; background: var(--navy); color: #fff; border-left: 6px solid var(--k); }
        .card .body { padding: 12px 14px 14px; }
        .card h3 { margin: 0; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .card h3 small { font-size: 12px; color: var(--muted); font-weight: 500; }
        /* タイトルのリンクをカード全体に広げる */
        .card-link { color: inherit; text-decoration: none; }
        .card-link::after { content: ""; position: absolute; inset: 0; }
        .card-link:focus-visible { outline: none; }
        .card:has(.card-link:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
        .card p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
        .featured .card h3 { font-size: 20px; }
        .featured .card p { font-size: 14px; }

        /* 作品・研究のページ：本文と、右のデータ欄 */
        .vplayer { position: relative; aspect-ratio: 16 / 9; border: 3px solid var(--navy); border-radius: var(--radius); overflow: hidden; background: #000; margin-bottom: 20px; }
        .vplayer video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
        /* 縦長の研究動画（Useless Machine など）は、横幅いっぱいにせず縦長の枠で出す。 */
        .vplayer[data-portrait] { aspect-ratio: 9 / 16; width: min(100%, calc(70vh * 9 / 16)); }
        .vsound {
            position: absolute;
            top: 12px;
            right: 12px;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: rgba(28, 34, 56, .6);
            color: #fff;
            padding: 0;
            cursor: pointer;
        }
        .vsound:hover { background: #fff; color: var(--navy); }
        .vsound svg { display: block; width: 24px; height: 24px; pointer-events: none; }
        @media (hover: hover) and (pointer: fine) {
            .vsound { opacity: 0; pointer-events: none; transition: opacity .15s ease; }
            .vplayer:hover .vsound, .vsound:focus-visible { opacity: 1; pointer-events: auto; }
        }
        @media (prefers-reduced-motion: reduce) {
            .vsound { transition: none; }
        }

        .detail { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
        .game .detail { grid-template-columns: 300px minmax(0, 1fr); }
        .prose p { margin: 0; font-size: 15px; line-height: 1.95; }
        .prose p + p { margin-top: 1em; }
        .data dl { margin: 0; display: grid; gap: 12px; font-size: 14px; }
        .data dt { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
        .data dd { margin: 2px 0 0; }
        .data .tags { margin: 0 0 16px; }
        .link-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
        .link-list a {
            display: block;
            padding: 9px 12px;
            border: 2px solid var(--navy);
            border-radius: 8px;
            color: var(--fg);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }
        .link-list a:hover { background: var(--navy); color: #fff; }
        .tag { border-color: var(--line); font-weight: 700; }

        .research-item { scroll-margin-top: 20px; }
        .research-item + .research-item { margin-top: 40px; }
        .research-title { margin: 0 0 14px; font-size: 22px; }

        .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 36px; }
        .pager a { padding: 12px 16px; color: var(--fg); text-decoration: none; font-weight: 700; }
        .pager a:hover { background: var(--navy); color: #fff; }
        .pager .label { display: block; color: var(--muted); font-size: 11px; }
        .pager a:hover .label { color: #aeb7d6; }
        .pager .next { text-align: right; grid-column: 2; }

        .topbar { display: none; }

        /* ---- 画面が狭いとき ---- */
        @media (max-width: 1180px) {
            .detail, .game .detail { grid-template-columns: 1fr; }
            .detail .data { order: -1; }
        }
        @media (max-width: 960px) {
            .sidebar { inset: 64px 10px 10px 10px; width: auto; z-index: 30; transform: translateY(-120%); transition: transform .25s ease; }
            .menu-open .sidebar { transform: none; }
            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                position: sticky;
                top: 0;
                z-index: 31;
                padding: 10px 14px;
                background: var(--navy);
                color: #fff;
            }
            .topbar strong { display: flex; align-items: center; gap: 10px; font-size: 15px; }
            .topbar img { width: 32px; height: 32px; border-radius: 6px; image-rendering: pixelated; background: #fff; }
            .topbar button { border: 2px solid #fff; border-radius: 8px; background: none; color: #fff; font: inherit; font-weight: 700; padding: 4px 12px; }
            main { margin-left: 0; padding: 22px 16px 64px; }
            .profile { grid-template-columns: 1fr; }
            .portrait { width: 160px; }
            .grid { grid-template-columns: 1fr 1fr; }
            .featured { grid-template-columns: 1fr; }
            .skills { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .grid, .pager { grid-template-columns: 1fr; }
            .pager .next { grid-column: auto; }
            .window-body { padding: 16px; }
        }
    </style>
    <link rel="stylesheet" href="shared/profile-character.css">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="a-skins/white-fill.css">
    <script src="a-skins/white-fill.js"></script>
</head>
<body>
    <div class="topbar">
        <strong id="topbar-name"></strong>
        <button type="button" aria-controls="sidebar" aria-expanded="false" id="menu-button"></button>
    </div>

    <aside class="sidebar" id="sidebar">
        <a class="sidebar-banner" href="#about" aria-label="Youkin（プロフィールへ）">
            <span class="banner-bg"></span>
            <img class="hop" style="--d: 0.00s" src="../Images/sidebar-banner/edge-0.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.15s" src="../Images/sidebar-banner/edge-1.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.30s" src="../Images/sidebar-banner/edge-2.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.45s" src="../Images/sidebar-banner/edge-3.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.60s" src="../Images/sidebar-banner/edge-4.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.75s" src="../Images/sidebar-banner/edge-5.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.00s" src="../Images/sidebar-banner/white-0.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.15s" src="../Images/sidebar-banner/white-1.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.30s" src="../Images/sidebar-banner/white-2.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.45s" src="../Images/sidebar-banner/white-3.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.60s" src="../Images/sidebar-banner/white-4.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.75s" src="../Images/sidebar-banner/white-5.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.00s" src="../Images/sidebar-banner/letter-0.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.15s" src="../Images/sidebar-banner/letter-1.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.30s" src="../Images/sidebar-banner/letter-2.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.45s" src="../Images/sidebar-banner/letter-3.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.60s" src="../Images/sidebar-banner/letter-4.png" alt="" width="642" height="200">
            <img class="hop" style="--d: 0.75s" src="../Images/sidebar-banner/letter-5.png" alt="" width="642" height="200">
            <img src="../Images/sidebar-banner/frame.png" alt="" width="642" height="200">
        </a>
        <a class="player" href="#about" id="player"></a>
        <nav class="menu" aria-label="メニュー" id="menu"></nav>
    </aside>

    <main id="main"><p>読み込み中…</p></main>

    <script src="shared/content.js"></script>
    <script src="shared/ui.js"></script>
    <script src="shared/details-motion.js"></script>
    <script src="shared/menu-keyboard.js"></script>
    <script src="shared/profile-guests.js"></script>
    <script src="shared/profile-sky.js"></script>
    <script src="shared/profile-flight.js"></script>
    <script src="shared/profile-walk.js"></script>
    <script>
        const { esc, tagsHTML, thumbUrl, linkHTML } = PortfolioUI;

        // ---- スキンの設定（書かなかった項目は既定のまま） ----
        const SKIN = window.SKIN || {};
        const LAYOUT = ['sections', 'tabs', 'flat'].includes(SKIN.layout) ? SKIN.layout : 'sections';
        const TEXT = {
            job: 'Job : Unity Engineer',
            menu: 'MENU',
            // サイドバーの大項目
            about: 'About',
            works: 'Works',
            research: 'Research',
            // About の中の項目
            profile: 'プロフィール',
            awards: '受賞歴',
            internships: 'インターン・バイト経験',
            media: 'メディア掲載',
            // ウィンドウの見出し
            status: 'Status',
            skills: 'Tech Stack',
            data: 'Data',
            links: 'Links',
            researchBody: '研究内容',
            researchData: 'Data',
            // ページ上部のラベル
            worksList: '作品一覧',
            worksLead: '',
            researchNo: 'Research No.',
            researchLab: '研究会',
            researchPeriod: '期間',
            back: '← 作品一覧へ戻る',
            prev: '◀ Prev',
            next: 'Next ▶',
            more: '詳しく見る',
            count: n => `${n}件`,
            // スキルの段階（1〜5）の言葉
            skillLevels: ['', '学習中', '基礎', '応用', '習熟', '得意分野'],
            unmute: '音を出す',
            mute: '音を消す',
            soundLabel: '動画の音声',
            ...(SKIN.text || {}),
        };
        const ICON_COLOR = /^[0-9a-f]{6}$/i.test(SKIN.iconColor || '') ? SKIN.iconColor : '1c2238';
        const MAIL_AS_TEXT = SKIN.mail === 'text';

        // 開発期間に年が書かれていない作品の制作年（GitHub・コミット日・大会名から確認）
        const YEAR_FALLBACK = { 'sausage-smash': 2026, 'jiya-robot-tea': 2026, 'project-siro': 2026, 'zelly-swipe': 2026, 'frying-pan': 2026 };
        const yearOf = p => (/(\d{4})年/.exec(p.period) || [])[1] || YEAR_FALLBACK[p.id] || '';
        const no = i => String(i + 1).padStart(2, '0');
        // 色分けの目印（色そのものは CSS で決める）
        const tone = i => `data-index="${i}" data-tone="${i % 4}"`;

        // About の中の項目（今のサイトの PROFILE と同じ並び。研究は Research として独立）
        const ABOUT_SECTIONS = ['', 'awards', 'internships', 'media'];
        const aboutLabel = id => TEXT[id || 'profile'];

        // 作品一覧で大きく出す2本
        const FEATURED = ['sausage-smash', 'pintch-witch'];

        // 動く見本（6秒のループ）と、作品ページの全編動画の置き場所
        const CLIP_BASE = new URL('../Images/clips/', location.href).href;
        // アイコンは Devicon 2.16.0 の同じ素材をローカル配信し、外部接続待ちをなくす。
        const DEVICON = new URL('../Images/icons/devicon/', location.href).href;
        const TECH_STACK = [
            { id: 'csharp', name: 'C#' },
            { id: 'unity', name: 'Unity' },
            { id: 'c', name: 'C' },
            { id: 'cpp', name: 'C++' },
            { id: 'git', name: 'Git' },
            { id: 'github', name: 'GitHub' },
            { id: 'blender', name: 'Blender' },
            { id: 'figma', name: 'Figma' },
        ];
        const MEDIA_BASE = 'https://youkin06.github.io/portfolio-media/videos/';

        document.body.dataset.layout = LAYOUT;

        loadPortfolio().then(data => {
            const projects = data.projects;
            // 研究は「【研究会名】テーマ」の形なので、研究会名とテーマに分ける。
            const research = data.research.map((r, i) => {
                const m = /^【(.+?)】(.+)$/.exec(r.org);
                const [body] = r.html.split(/<strong>\s*関連リンク/);
                const links = [...new DOMParser().parseFromString(r.html, 'text/html').querySelectorAll('a[href]')]
                    .map(a => ({ href: a.getAttribute('href'), label: a.textContent.replace(/\s+/g, ' ').trim() }));
                return { ...r, id: String(i + 1), lab: m ? m[1] : '', theme: m ? m[2] : r.org, body: body.replace(/(<br\s*\/?>\s*)+$/, ''), links };
            });
            const main = document.getElementById('main');

            // ---- サイドバー ----
            const avatar = data.profile.pixel || data.profile.photo;
            document.getElementById('player').innerHTML = `
                <img src="${esc(avatar)}" alt="">
                <div><strong>${esc(data.profile.name)}</strong><span class="label">${esc(TEXT.job)}</span></div>`;
            document.getElementById('topbar-name').innerHTML = `<img src="${esc(avatar)}" alt="">${esc(data.profile.name)}`;
            document.getElementById('menu-button').textContent = TEXT.menu;

            const groupHTML = (section, href, items) => `
                <div class="menu-group" data-section="${section}">
                    ${SKIN.menuHeadings ? `<h2 class="menu-label label">${esc(TEXT[section])}</h2>` : `<a class="menu-label label" href="${href}">${esc(TEXT[section])}</a>`}
                    ${LAYOUT === 'flat' ? '' : `<ul class="menu-list">${items}</ul>`}
                </div>`;
            document.getElementById('menu').innerHTML =
                groupHTML('about', '#about', ABOUT_SECTIONS.map(id =>
                    `<li><a href="${id ? `#about/${id}` : '#about'}" data-key="about/${id}">${esc(aboutLabel(id))}</a></li>`).join('')) +
                groupHTML('works', '#works',
                    `<li><a href="#works" data-key="works/">${esc(TEXT.worksList)}</a></li>` +
                    projects.map(p => `<li><a href="#works/${esc(p.id)}" data-key="works/${esc(p.id)}">${esc(p.title)}<span class="year">${yearOf(p)}</span></a></li>`).join('')) +
                groupHTML('research', LAYOUT === 'flat' ? '#research' : `#research/${research[0]?.id || ''}`, research.map(r =>
                    `<li><a href="#research/${r.id}" data-key="research/${r.id}">${esc(r.theme)}</a></li>`).join(''));

            // ---- 部品 ----
            // 本文中の「制作作品：〇〇」（#project-〇〇）は、そのゲームのページへ。
            const fixProjectLinks = html => html.replace(/href="#project-/g, 'href="#works/');
            const link = l => fixProjectLinks(linkHTML(l)).replace('class="link--internal" href="#works/', 'class="link--work" href="#works/');

            // title を null にすると見出しを出さない（ページの見出しと同じ言葉が重なるとき）
            const block = (key, title, body, count) => `
                <section class="window block" data-block="${key}" id="block-${key}">
                    ${title === null ? '' : `<h2 class="window-title label">${esc(title)}${count !== undefined ? `<span class="count">${esc(TEXT.count(count))}</span>` : ''}</h2>`}
                    <div class="window-body">${body}</div>
                </section>`;

            // 説明は「詳しく見る」で開く。一度に開くのは1つだけ。
            // 開閉の動きがあるスキンは details-motion.js が、ないスキンはブラウザの name 属性が、ほかの開いている項目を閉じる。
            const expHTML = i => `
                <li class="exp">
                    <div class="exp-head">
                        <h3 class="exp-role">${esc(i.role || i.org)}</h3>
                        ${i.role ? `<span class="exp-org">${esc(i.org)}</span>` : ''}
                        <time class="exp-period">${esc(i.period)}</time>
                    </div>
                    <details class="exp-more"${SKIN.detailsMotion ? '' : ' name="exp"'}><summary>${esc(TEXT.more)}</summary>
                        <div class="exp-content"><div class="exp-detail"${i.image ? ' data-photo' : ''}>
                            <div class="exp-copy">
                                <p>${fixProjectLinks(i.html)}</p>
                                ${i.links.length ? `<div class="exp-links">${i.links.map(link).join('')}</div>` : ''}
                            </div>
                            ${i.image ? `<figure><img src="${esc(i.image.src)}" alt="${esc(i.image.alt)}"${i.image.width && i.image.height ? ` width="${i.image.width}" height="${i.image.height}"` : ''} loading="eager" decoding="async"><figcaption>${esc(i.image.caption)}</figcaption></figure>` : ''}
                        </div></div>
                    </details>
                </li>`;
            const itemHTML = a => `
                <li class="item"><span class="item-text">${esc(a.text)}</span>
                ${a.link ? `<div class="item-links">${link(a.link)}</div>` : ''}</li>`;

            const gaugeHTML = rating => `<span class="gauge" aria-hidden="true">${[1, 2, 3, 4, 5].map(n => `<i class="${n <= rating ? 'on' : ''}"></i>`).join('')}</span>`;
            const iconUrl = src => src.replace(/(cdn\.simpleicons\.org\/[^/]+)\/[0-9a-f]{6}$/i, `$1/${ICON_COLOR}`);
            const mailIcon = '<svg class="mail-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>';

            // 段落ごとに <p> に分けて読みやすくする（元の文章は <br><br> で段落を区切っている）。
            const paragraphs = html => html.split(/(?:<br\s*\/?>\s*){2,}/).map(part => `<p>${part.trim()}</p>`).join('');

            const pageHead = (label, title, lead) => `
                <header class="page-head">${label ? `<div class="label">${esc(label)}</div>` : ''}<h1>${esc(title)}</h1>${lead ? `<p>${esc(lead)}</p>` : ''}</header>`;

            const pagerHTML = (prev, next, href, label) => `
                <nav class="pager" aria-label="前後">
                    ${prev ? `<a class="window prev" href="${href(prev)}"><span class="label">${esc(TEXT.prev)}</span>${esc(label(prev))}</a>` : ''}
                    ${next ? `<a class="window next" href="${href(next)}"><span class="label">${esc(TEXT.next)}</span>${esc(label(next))}</a>` : ''}
                </nav>`;

            // ---- About ----
            const profileCharacter = `
                            <div class="profile-meadow">
                              <div class="profile-sky" aria-hidden="true">
                                <span class="profile-stars"></span>
                                <span class="profile-sun"></span>
                                <span class="profile-moon"></span>
                                <span class="profile-cloud" style="--cloud-y: 60%; --cloud-time: 140s; --cloud-delay: -40s; --cloud-rest: 12%"></span>
                                <span class="profile-cloud" style="--cloud-y: 74%; --cloud-scale: .7; --cloud-time: 190s; --cloud-delay: -130s; --cloud-rest: 58%"></span>
                                <span class="profile-cloud" style="--cloud-y: 66%; --cloud-scale: .85; --cloud-time: 165s; --cloud-delay: -95s; --cloud-rest: 80%"></span>
                              </div>
                              <div class="profile-walkway">
                                <div class="profile-character" data-profile-guest>
                                  <button class="profile-guest-trigger" type="button" aria-label="ぼくのにっきのキャラクター：作品リンクを表示" aria-expanded="false"></button>
                                  <a class="profile-guest-link" href="#works/boku-no-nikki">ぼくのにっき<span>作品を見る →</span></a>
                                  <div class="profile-character-facing">
                                    <div class="profile-character-pose profile-character-idle">
                                      <img src="../Images/profile-character/idle1.png" alt="" width="256" height="256">
                                      <img src="../Images/profile-character/idle2.png" alt="" width="256" height="256">
                                    </div>
                                    <div class="profile-character-pose profile-character-walk">
                                      <img src="../Images/profile-character/walk1.png" alt="" width="256" height="256">
                                      <img src="../Images/profile-character/walk2.png" alt="" width="256" height="256">
                                    </div>
                                  </div>
                                </div>
                                <div class="profile-kamo" data-profile-guest>
                                  <button class="profile-guest-trigger" type="button" aria-label="KamoRogueのキャラクター：作品リンクを表示" aria-expanded="false"></button>
                                  <a class="profile-guest-link" href="#works/project-6">KamoRogue<span>作品を見る →</span></a>
                                  <div class="profile-kamo-facing">
                                    <span class="profile-kamo-frame"><img src="../Images/profile-character/kamo-run1.png" alt="" width="16" height="16"></span>
                                    <span class="profile-kamo-frame"><img src="../Images/profile-character/kamo-run2.png" alt="" width="16" height="16"></span>
                                  </div>
                                </div>
                              </div>
                              <div class="profile-ground"></div>
                            </div>
                            <div class="profile-flight">
                              <div class="profile-depth-player" data-profile-guest>
                                <button class="profile-guest-trigger" type="button" aria-label="DEPTH DIARYのキャラクター：作品リンクを表示" aria-expanded="false"></button>
                                <a class="profile-guest-link" href="#works/depth-diary">DEPTH DIARY<span>作品を見る →</span></a>
                                <div class="profile-depth-player-facing">
                                  <img src="../Images/profile-character/depth-player1.png" alt="" width="16" height="16" style="--frame-index: 0">
                                  <img src="../Images/profile-character/depth-player2.png" alt="" width="16" height="16" style="--frame-index: 1">
                                  <img src="../Images/profile-character/depth-player3.png" alt="" width="16" height="16" style="--frame-index: 2">
                                  <img src="../Images/profile-character/depth-player4.png" alt="" width="16" height="16" style="--frame-index: 3">
                                </div>
                              </div>
                            </div>`;
            // ---- プロフィールの版（確認用：URL に ?profile=intro|numbers|history。付けなければ今の形） ----
            const PROFILE_STYLE = new URLSearchParams(location.search).get('profile') || SKIN.profile || '';
            // ボタンと数字の見た目の案（確認用：URL に ?ui=a|b|c）。html[data-ui] に書き、CSS が見た目を変える。
            document.documentElement.dataset.ui = new URLSearchParams(location.search).get('ui') || SKIN.ui || '';
            // 「大学：〜」「所属：〜」「目標：〜」の行を、見出しと中身に分けて使う。
            const profileFacts = Object.fromEntries(data.profile.aboutHtml.split(/<br\s*\/?>/).map(line => {
                const t = line.replace(/<[^>]+>/g, '').trim();
                const i = t.indexOf('：');
                return i < 0 ? null : [t.slice(0, i), t.slice(i + 1).replace(/^「|」$/g, '')];
            }).filter(Boolean));
            const portraitHTML = () => `
                            <div class="portrait">
                                <img src="${esc(data.profile.photo)}" alt="顔写真" width="600" height="600" loading="eager" fetchpriority="high" decoding="async">
                                ${data.profile.pixel ? `<img class="pixel" src="${esc(data.profile.pixel)}" alt="">` : ''}
                            </div>`;
            const contactsHTML = () => `
                                <div class="contacts">
                                    <div class="contacts-social">${data.profile.socials.map(s => `<a class="social" href="${esc(s.href)}" target="_blank" rel="noopener noreferrer">${s.icon ? `<img src="${esc(iconUrl(s.icon))}" alt="">` : ''}${esc(s.label)}</a>`).join('')}</div>
                                    <div class="contacts-mail">${data.profile.emails.map(m => MAIL_AS_TEXT ? `<span class="mail">${mailIcon}<span>${esc(m)}</span></span>` : `<a class="mail-button" href="mailto:${esc(m)}">${mailIcon}<span>${esc(m)}</span></a>`).join('')}</div>
                                </div>`;
            // 大学・所属・目標を、見出しと中身の同じ形の行で並べる。目標の中身だけ色を変える（goal = true のとき目標も出す）。
            const profileRole = (goal = false) => `
                                <dl class="profile-facts">${['大学', '所属', ...(goal ? ['目標'] : [])].filter(k => profileFacts[k]).map(k => `
                                    <div${k === '目標' ? ' class="profile-goal"' : ''}><dt>${k}</dt><dd>${esc(profileFacts[k])}</dd></div>`).join('')}
                                </dl>`;
            // 受賞歴・インターン・メディア掲載から、年月の分かるできごとを新しい順に拾う（プロフィールには新しい6件）。
            const profileHistory = () => [
                ...data.awards.map(a => ({ text: a.text.replace(/^\d{4}年\s*/, ''), when: a.text.match(/(\d{4})/) })),
                ...data.internships.map(i => ({ text: `${i.org} ${i.role || ''}`.trim() + (i.period.includes('予定') ? '（予定）' : ''), when: i.period.match(/(\d{4})年(\d{1,2})月/) })),
                ...data.media.map(a => ({ text: `${a.text.replace(/^[\d年月日]+\s*/, '')} に掲載`, when: a.text.match(/(\d{4})年(\d{1,2})月/) })),
            ].filter(e => e.when).map(e => ({ ...e, y: +e.when[1], m: +(e.when[2] || 0) }))
                .sort((a, b) => b.y - a.y || b.m - a.m);
            const PROFILE_VERSIONS = {
                // 今の形：「大学：〜」などの3行
                '': () => `
                        <div class="profile">${portraitHTML()}
                            <div>
                                <p class="profile-name">${esc(data.profile.name)}</p>
                                <p class="profile-text">${data.profile.aboutHtml}</p>${contactsHTML()}
                            </div>
                        </div>`,
                // ひとことと紹介文：大きなひとこと → 名前 → 紹介文 → 所属の札
                intro: () => `
                        <div class="profile profile--intro">${portraitHTML()}
                            <div>
                                <p class="profile-lead">${esc(data.hero.tagline)}</p>
                                <p class="profile-name">${esc(data.profile.name)}</p>
                                ${profileRole()}
                                <p class="profile-bio">Unity を中心に、VR やハンドトラッキング、2D アクションなど、いろいろな遊び方のゲームを作っています。目標は「${esc(profileFacts['目標'] || '')}」ことです。</p>${contactsHTML()}
                            </div>
                        </div>`,
                // 数字で見る：作品・受賞・インターン・メディア掲載・研究の数。押すとそのページへ。
                numbers: () => `
                        <div class="profile profile--numbers">${portraitHTML()}
                            <div>
                                <p class="profile-name">${esc(data.profile.name)}</p>
                                ${profileRole(true)}${contactsHTML()}
                            </div>
                        </div>
                        <ul class="profile-stats">${[
                            [data.projects.length, '作品', '#works', 'works'],
                            [data.awards.length, '受賞・入選', '#about/awards', 'about'],
                            [data.internships.length, 'インターン・バイト', '#about/internships', 'about'],
                            [data.media.length, 'メディア掲載', '#about/media', 'about'],
                            [data.research.length, '研究', `#research/${data.research[0]?.id || ''}`, 'research'],
                        ].map(([n, label, href, section]) => `<li data-to="${section}"><a href="${href}"><strong>${n}</strong><span>${esc(label)}</span></a></li>`).join('')}</ul>`,
                // これまで：受賞歴・インターン・メディア掲載を、新しい順の年表にする。
                history: () => `
                        <div class="profile profile--history">${portraitHTML()}
                            <div>
                                <p class="profile-name">${esc(data.profile.name)}</p>
                                ${profileRole(true)}${contactsHTML()}
                            </div>
                        </div>
                        <ol class="profile-history">${profileHistory().slice(0, 6).map(e => `<li><time>${e.y}${e.m ? `.${String(e.m).padStart(2, '0')}` : ''}</time><span>${esc(e.text)}</span></li>`).join('')}</ol>`,
            };
            const aboutBlocks = {
                '': (single = false) => block('profile', single ? null : TEXT.profile, (PROFILE_VERSIONS[PROFILE_STYLE] || PROFILE_VERSIONS[''])()) +
                    block('skills', TEXT.skills, `<ul class="tech-stack-list">${TECH_STACK.map(tech => `
                        <li class="tech" data-tech="${esc(tech.id)}" title="${esc(tech.name)}"><img src="${DEVICON}${tech.id}.svg" alt="${esc(tech.name)}" width="44" height="44" loading="eager" decoding="async"></li>`).join('')}
                    </ul>`),
                internships: (single = false) => block('internships', single ? null : TEXT.internships, `<ol class="exp-list timeline">${data.internships.map(expHTML).join('')}</ol>`),
                awards: (single = false) => block('awards', single ? null : TEXT.awards, `<ul class="item-list awards">${data.awards.map(itemHTML).join('')}</ul>`),
                media: (single = false) => block('media', single ? null : TEXT.media, `<ul class="item-list media">${data.media.map(itemHTML).join('')}</ul>`),
            };
            // About は1ページにまとめる（プロフィール → 受賞歴 → インターン・バイト経験 → メディア掲載）。
            // サイドバーの中の項目は、このページの中の場所へのリンクになる。
            // About の中の項目は1つずつのページ（プロフィール／受賞歴／インターン・バイト経験／メディア掲載）
            const aboutPage = sub => {
                const id = ABOUT_SECTIONS.includes(sub) ? sub : '';
                return `
                    <article class="page page--narrow about">
                        ${pageHead(TEXT.about, aboutLabel(id))}
                        <div class="stack" data-single>${aboutBlocks[id](true)}</div>
                        ${profileCharacter}
                    </article>`;
            };

            // ---- Works ----
            const clipHTML = p => p.videoId ? `
                <video muted loop playsinline preload="none" data-src="${CLIP_BASE}${esc(p.videoId)}.mp4"
                    poster="${CLIP_BASE}${esc(p.videoId)}.jpg" aria-hidden="true"
                    onerror="this.outerHTML='<img src=&quot;${thumbUrl(p.videoId, 'mqdefault')}&quot; alt=&quot;&quot;>'"></video>` : '';
            const cardHTML = p => {
                const i = projects.indexOf(p);
                return `
                    <article class="card window work" ${tone(i)}${FEATURED.includes(p.id) ? ' data-featured' : ''}>
                        <div class="thumb">${clipHTML(p)}</div>
                        <div class="body">
                            <h3><a class="card-link" href="#works/${esc(p.id)}">${esc(p.title)}</a><small>${yearOf(p)}</small></h3>
                            <p>${esc(p.summary)}</p>${tagsHTML(p.tags)}
                        </div>
                    </article>`;
            };
            const worksPage = () => `
                <article class="page">
                    ${pageHead(TEXT.works, TEXT.worksList, TEXT.worksLead)}
                    <div class="works">
                        <div class="featured big">${projects.filter(p => FEATURED.includes(p.id)).map(cardHTML).join('')}</div>
                        <div class="grid">${projects.filter(p => !FEATURED.includes(p.id)).map(cardHTML).join('')}</div>
                    </div>
                </article>`;

            const soundIcon = muted => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4V4Z"/>${muted ? '<path d="m16 9 6 6m0-6-6 6"/>' : '<path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>'}</svg>`;
            const playerHTML = (id, title) => id ? `
                <div class="vplayer" data-player>
                    <video src="${MEDIA_BASE}${esc(id)}.mp4" poster="${CLIP_BASE}${esc(id)}.jpg"
                        autoplay muted loop playsinline preload="metadata" aria-label="${esc(title)} のプレイ動画"></video>
                    <button class="vsound" type="button" data-act="mute" aria-label="${esc(TEXT.soundLabel)}" aria-pressed="false" title="${esc(TEXT.unmute)}">${soundIcon(true)}</button>
                </div>` : '';

            // 作品情報は4項目に固定。使用技術は技術説明の末尾にテキストで表示する。
            const FACT_LABELS = ['ジャンル', '開発期間', '開発体制', '担当'];
            const gamePage = id => {
                const index = projects.findIndex(p => p.id === id);
                if (index < 0) return worksPage();
                const p = projects[index];
                const facts = FACT_LABELS.map(label => p.fields.find(f => f.label === label) || { label, html: '—' });
                const sections = p.fields.filter(f => !FACT_LABELS.includes(f.label) && !['使用技術', 'GitHubリポジトリ'].includes(f.label));
                const technologies = [...new Set(p.tech.split('、').map(name => name.trim()).filter(Boolean))];
                const techListHTML = technologies.length ? `<p class="tech-list">${esc(technologies.join('、'))}</p>` : '';
                const techHTML = techListHTML ? `<div class="tech-stack"><h3 class="label">使用技術</h3>${techListHTML}</div>` : '';
                const repositoryNote = p.fields.find(f => f.label === 'GitHubリポジトリ');
                return `
                    <article class="page game" ${tone(index)} data-game="${esc(p.id)}">
                        <a class="back" href="#works">${esc(TEXT.back)}</a>
                        ${pageHead(TEXT.works, p.title, p.summary)}
                        ${playerHTML(p.videoId, p.title)}
                        <div class="detail">
                            <aside class="stack data workdata">
                                ${block('data', TEXT.data, `<dl>${facts.map(f => `<div><dt>${esc(f.label)}</dt><dd>${fixProjectLinks(f.html)}</dd></div>`).join('')}</dl>`)}
                                ${p.links.length || repositoryNote ? block('links', TEXT.links, `${p.links.length ? `<ul class="link-list">${p.links.map(l => `<li>${link(l)}</li>`).join('')}</ul>` : ''}${repositoryNote ? `<p class="repository-note">${esc(repositoryNote.label)}：${esc(repositoryNote.plain)}</p>` : ''}`) : ''}
                            </aside>
                            <div class="stack detail-main">
                                ${sections.map((f, i) => `
                                    <section class="window block" data-block="${esc(f.label)}" ${tone(index + i)}>
                                        <h2 class="window-title label">${esc(f.label)}</h2>
                                        <div class="window-body prose">${paragraphs(fixProjectLinks(f.html))}${f.label === '技術説明' ? techHTML : ''}</div>
                                    </section>`).join('')}
                                ${!sections.some(f => f.label === '技術説明') && techListHTML ? block('technology', '使用技術', techListHTML) : ''}
                            </div>
                        </div>
                    </article>`;
            };

            // ---- 研究 ----
            const researchItemHTML = (r, i, headingTag) => `
                <article class="research-item" id="research-${r.id}" ${tone(i)}>
                    ${headingTag === 'h2' ? `<h2 class="research-title">${esc(r.theme)}</h2>` : ''}
                    <div class="detail">
                        <div class="stack detail-main">
                            ${block(`research-body-${r.id}`, TEXT.researchBody, `<div class="prose">${paragraphs(r.body)}</div>`)}
                        </div>
                        <aside class="stack data">
                            ${block(`research-data-${r.id}`, TEXT.researchData, `<dl>${r.lab ? `<div><dt>${esc(TEXT.researchLab)}</dt><dd>${esc(r.lab)}</dd></div>` : ''}<div><dt>${esc(TEXT.researchPeriod)}</dt><dd>${esc(r.period)}</dd></div></dl>`)}
                            ${r.links.length ? block(`research-links-${r.id}`, TEXT.links, `<ul class="link-list">${r.links.map(l => `<li>${link(l)}</li>`).join('')}</ul>`) : ''}
                        </aside>
                    </div>
                </article>`;
            // 研究は1件ずつのページ
            // 研究の紹介動画。音のある動画だけ、作品ページと同じ音の切り替えボタンを付ける。縦長の動画は縦長の枠で出す。
            const researchVideoHTML = r => r.video ? `
                <div class="vplayer research-video" data-player>
                    <video src="${esc(r.video.src)}" poster="${esc(r.video.src.replace(/\.mp4$/, '.jpg'))}"
                        autoplay muted loop playsinline preload="metadata" aria-label="${esc(r.theme)} の動画"
                        onloadedmetadata="this.parentElement.toggleAttribute('data-portrait', this.videoHeight > this.videoWidth)"></video>
                    ${r.video.audio ? `<button class="vsound" type="button" data-act="mute" aria-label="${esc(TEXT.soundLabel)}" aria-pressed="false" title="${esc(TEXT.unmute)}">${soundIcon(true)}</button>` : ''}
                </div>` : '';
            const researchPage = id => {
                const index = Math.max(0, research.findIndex(r => r.id === id));
                const r = research[index];
                return `
                    <article class="page research">
                        ${pageHead(TEXT.research, r.theme)}
                        ${researchVideoHTML(r)}
                        ${researchItemHTML(r, index, 'none')}
                    </article>`;
            };

            // 見えている動く見本だけ再生し、画面外に出たら止める。
            const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const clipObserver = new IntersectionObserver(entries => entries.forEach(entry => {
                const video = entry.target;
                if (entry.isIntersecting) {
                    if (!video.src) video.src = video.dataset.src;
                    if (!reduceMotion) video.play().catch(() => {});
                } else {
                    video.pause();
                }
            }), { rootMargin: '100px 0px' });

            // ---- スマホのメニュー ----
            const menuButton = document.getElementById('menu-button');
            const closeMenu = () => {
                document.body.classList.remove('menu-open');
                menuButton.setAttribute('aria-expanded', 'false');
            };
            menuButton.addEventListener('click', () => {
                const open = document.body.classList.toggle('menu-open');
                menuButton.setAttribute('aria-expanded', String(open));
            });

            // ---- 1ページにまとめた About と研究：中の項目の場所 ----
            const anchorsOf = section => section === 'about'
                ? ABOUT_SECTIONS.map(id => ({ key: id, el: document.getElementById(`block-${id || 'profile'}`) }))
                : [];

            // サイドバーの選択と、body の目印を今いる場所に合わせる
            const markActive = (section, subKey) => {
                document.body.dataset.section = section;
                document.body.dataset.page = `${section}/${subKey}`;
                document.querySelectorAll('.menu-group').forEach(group => {
                    const active = group.dataset.section === section;
                    active ? group.setAttribute('data-active', '') : group.removeAttribute('data-active');
                    const label = group.querySelector('.menu-label');
                    if (label.tagName === 'A') active ? label.setAttribute('aria-current', 'page') : label.removeAttribute('aria-current');
                });
                document.querySelectorAll('[data-key]').forEach(a => {
                    const active = a.dataset.key === `${section}/${subKey}`;
                    a.classList.toggle('active', active);
                    active ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
                });
                document.querySelector('.menu .active')?.scrollIntoView({ block: 'nearest' });
            };

            // スクロールして読み進めたら、今読んでいる項目をサイドバーで選ぶ（ページは切り替えない）
            let renderedSection = null;
            let scrollTicking = false;
            // サイドバーで選んで移動した直後は、その選択を保つ（短いページの最後の方の項目でも、選んだものが選ばれたままになる）
            let keepChoice = false;
            ['wheel', 'touchmove', 'keydown'].forEach(type => window.addEventListener(type, () => { keepChoice = false; }, { passive: true }));
            const followScroll = () => {
                scrollTicking = false;
                if (keepChoice) return;
                const anchors = anchorsOf(renderedSection).filter(a => a.el);
                if (!anchors.length) return;
                const line = window.innerHeight * .3;
                const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
                let current = anchors[0];
                anchors.forEach(a => { if (a.el.getBoundingClientRect().top <= line) current = a; });
                if (atBottom) current = anchors[anchors.length - 1];
                if (document.body.dataset.page === `${renderedSection}/${current.key}`) return;
                markActive(renderedSection, current.key);
                history.replaceState(null, '', current.key ? `#${renderedSection}/${current.key}` : `#${renderedSection}`);
            };
            window.addEventListener('scroll', () => {
                if (scrollTicking) return;
                scrollTicking = true;
                requestAnimationFrame(followScroll);
            }, { passive: true });

            // ---- 表示の切り替え（最初は About） ----
            const render = () => {
                const [route, rawSub] = location.hash.slice(1).split('/');
                const sub = rawSub ? decodeURIComponent(rawSub) : '';
                const section = ['about', 'works', 'research'].includes(route) ? route : 'about';
                // 1ページにまとめているのは About だけ
                // 1ページにまとめている場所は今はない（About も研究も項目ごとのページ）
                const onePage = false;

                // 同じ1ページの中の移動なら、作り直さずにその場所までスクロールするだけ
                if (!(onePage && renderedSection === section)) {
                    main.innerHTML =
                        section === 'about' ? aboutPage(sub) :
                        section === 'research' ? researchPage(sub) :
                        sub ? gamePage(sub) : worksPage();
                    renderedSection = section;
                    clipObserver.disconnect();
                    main.querySelectorAll('video[data-src]').forEach(v => clipObserver.observe(v));
                    // 折りたたみ内の写真も先にデコードし、開いた瞬間の表示待ちを減らす。
                    main.querySelectorAll('.exp-detail img').forEach(img => img.decode?.().catch(() => {}));
                }

                const subKey = section === 'research' && !sub ? research[0]?.id || '' : sub;
                markActive(section, subKey);

                const target = onePage && sub ? anchorsOf(section).find(a => a.key === sub)?.el : null;
                keepChoice = Boolean(target);
                target ? target.scrollIntoView({ block: 'start' }) : window.scrollTo(0, 0);
                closeMenu();
            };

            // ---- 動画は自動ループ。操作は右上の音声切り替えだけ ----
            const syncPlayer = player => {
                const video = player.querySelector('video');
                const button = player.querySelector('[data-act=mute]');
                button.innerHTML = soundIcon(video.muted);
                button.setAttribute('aria-pressed', String(!video.muted));
                button.title = video.muted ? TEXT.unmute : TEXT.mute;
            };
            main.addEventListener('click', event => {
                const button = event.target.closest('[data-player] [data-act=mute]');
                if (!button) return;
                const player = button.closest('[data-player]');
                const video = player.querySelector('video');
                video.muted = !video.muted;
                if (video.paused) video.play().catch(() => {});
                syncPlayer(player);
            });
            main.addEventListener('volumechange', event => {
                const player = event.target.closest?.('[data-player]');
                if (player) syncPlayer(player);
            }, true);

            window.addEventListener('hashchange', render);
            render();
            document.addEventListener('open-project', event => { location.hash = `works/${event.detail}`; });
        });
    </script>
</body>
</html>
