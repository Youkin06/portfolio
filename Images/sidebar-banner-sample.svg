<svg xmlns="http://www.w3.org/2000/svg" width="624" height="312" viewBox="0 0 624 312">
  <!-- サイドバーの一番上に置く見出し画像の仮置き（624×312、表示は 312×156） -->
  <rect width="624" height="312" fill="#ffffff"/>
  <!-- ゲームのボタン風：ずらした赤い影と黒い枠 -->
  <rect x="36" y="44" width="568" height="244" rx="18" fill="#e2483d"/>
  <rect x="24" y="30" width="568" height="244" rx="18" fill="#ffffff" stroke="#1c1c1c" stroke-width="5"/>
  <!-- 3色の札（About 赤・Works 青・Research 緑） -->
  <rect x="56" y="62" width="28" height="28" rx="5" fill="#e2483d"/>
  <rect x="94" y="62" width="28" height="28" rx="5" fill="#2f7fd6"/>
  <rect x="132" y="62" width="28" height="28" rx="5" fill="#4fae3a"/>
  <text x="308" y="190" text-anchor="middle"
        font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif"
        font-size="100" font-weight="900" fill="#1c1c1c" letter-spacing="4">ヨウキン</text>
  <text x="308" y="242" text-anchor="middle"
        font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif"
        font-size="30" font-weight="700" fill="#e2483d" letter-spacing="8">のポートフォリオ</text>
  <text x="566" y="82" text-anchor="end" font-family="sans-serif" font-size="16" fill="#9a9a9a">SAMPLE 624×312</text>
</svg>
